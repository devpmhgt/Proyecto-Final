# Levanta MySQL 8 para desarrollo:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: saiu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: saiu
      MYSQL_USER: saiu
      MYSQL_PASSWORD: saiu_pass
    ports:
      - "3306:3306"
    volumes:
      - saiu_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  saiu_mysql:
